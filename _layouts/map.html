<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" type="image/png" sizes="270x270" href="{{ '/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/calendar-map.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    {% include header.html %}
    <main class="map-home" id="contenuto">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
