<link rel="stylesheet" href="{{ '/assets/css/calendar-days.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/account-header.css' | relative_url }}">
<script src="{{ '/assets/js/account-header.js' | relative_url }}" defer></script>
<header class="site-header" aria-label="Intestazione del sito">
  <div class="site-header__inner">
    <a class="site-header__brand" href="https://naturadipianura.it/" aria-label="GIAPP — vai al sito Natura di Pianura">
      <img src="{{ '/images/giapp-logo.svg' | relative_url }}" alt="GIAPP" width="990" height="280">
    </a>
    <a class="header-account" href="{{ '/registrazione.html' | relative_url }}" data-header-account data-config-url="{{ '/assets/registration-config.json' | relative_url }}" data-animal-base="{{ '/images/animali/' | relative_url }}">
      <span class="header-account__guest" data-header-guest>Crea il tuo esploratore</span>
      <img class="header-account__avatar" data-header-avatar width="58" height="58" alt="" hidden>
      <span class="header-account__text" data-header-identity hidden><strong class="header-account__name" data-header-name></strong><span class="header-account__score" data-header-score></span></span>
    </a>
    <nav class="site-header__nav" aria-label="Navigazione principale">
      <ul>
        <li><a href="https://naturadipianura.it/chi-siamo/">Chi siamo</a></li>
        <li><a href="https://naturadipianura.it/luoghi/">Aree GIAPP</a></li>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>Calendario</a></li>
        <li><a href="{{ '/classifica.html' | relative_url }}"{% if page.url == '/classifica.html' %} aria-current="page"{% endif %}>Classifica</a></li>
        <li><a href="{{ '/registrazione.html' | relative_url }}"{% if page.url == '/registrazione.html' %} aria-current="page"{% endif %}>Il mio account</a></li>
      </ul>
    </nav>
  </div>
</header>
